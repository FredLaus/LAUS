<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAUS | E-commerce & Dropshipping</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background-color: #0a1128; border-b: 1px solid #1f2937; padding: 15px; text-align: center; }
        .logo h1 { color: #3b82f6; font-size: 24px; font-weight: 900; }
        .logo p { color: #9ca3af; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; }
        
        nav { background-color: #1a1a1a; padding: 10px; overflow-x: auto; display: flex; gap: 8px; justify-content: center; }
        .btn-aba { white-space: nowrap; background-color: #2d3748; border: 1px solid #4a5568; color: #a0aec0; font-size: 12px; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        .btn-aba.ativa { background-color: #2563eb; border-color: #3b82f6; color: #fff; }

        main { flex-grow: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; }
        .vitrine-topo { display: flex; justify-content: space-between; margin-bottom: 20px; }
        
        .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card-produto { background-color: #161616; border: 1px solid #2d3748; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; }
        .img-container { width: 100%; height: 160px; background-color: #222; border-radius: 6px; overflow: hidden; margin-bottom: 10px; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .tag-desconto { position: absolute; top: 5px; right: 5px; background-color: #dc2626; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 4px; }
        .card-titulo { font-size: 14px; color: #e5e7eb; margin-bottom: 10px; min-height: 36px; }
        .preco-antigo { font-size: 11px; color: #6b7280; text-decoration: line-through; display: block; }
        .preco-atual { font-size: 16px; font-weight: 700; color: #60a5fa; margin-bottom: 12px; display: block; }
        .btn-comprar { width: 100%; text-align: center; background-color: #2563eb; color: #fff; font-weight: bold; font-size: 12px; padding: 10px; border-radius: 6px; text-decoration: none; display: block; }

        footer { background-color: #0a1128; padding: 20px; text-align: center; font-size: 12px; color: #9ca3af; margin-top: auto; }
    </style>
</head>
<body>

    <!-- 1. CABEÇALHO -->
    <header>
        <div class="logo">
            <h1>LAUS</h1>
            <p>E-commerce & Dropshipping</p>
        </div>
    </header>

    <!-- 2. MENU DE CATEGORIAS -->
    <nav id="containerAbas"></nav>

    <!-- 3. VITRINE -->
    <main>
        <div class="vitrine-topo">
            <h2 id="tituloCategoria">Carregando...</h2>
            <span id="contadorProdutos" class="contador">0 itens</span>
        </div>
        <div id="gridProdutos" class="grid-produtos"></div>
    </main>

    <!-- 4. RODAPÉ -->
    <footer>
        <p>&copy; 2026 LAUS. Todos os direitos reservados.</p>
    </footer>

    <!-- 5. SCRIPT À PROVA DE FALHAS -->
    <script>
        const categorias = [
            { id: "mais_vendidos", nome: "🔥 Mais Vendidos" },
            { id: "eletronicos", nome: "📱 Eletrônicos" },
            { id: "casa_cozinha", nome: "🏠 Casa e Cozinha" },
            { id: "moda_beleza", nome: "💅 Moda e Beleza" }
        ];

        let categoriaAtiva = "eletronicos";

        const produtos = [
            {
                id: 1,
                titulo: "Fone de Ouvido Bluetooth Sem Fio TWS - Antirruído Pro",
                precoOriginal: 199.90,
                precoOferta: 99.90,
                desconto: "-50%",
                imagem: "https://unsplash.com",
                categoria: "eletronicos",
                linkAfiliado: "#"
            },
            {
                id: 2,
                titulo: "Relógio Smartwatch Digital Esportivo Inteligente Bluetooth",
                precoOriginal: 249.90,
                precoOferta: 129.90,
                desconto: "-48%",
                imagem: "https://unsplash.com",
                categoria: "eletronicos",
                linkAfiliado: "#"
            }
        ];

        function renderizarAbas() {
            const container = document.getElementById('containerAbas');
            if(!container) return;
            
            let html = "";
            for (let i = 0; i < categorias.length; i++) {
                const cat = categorias[i];
                const classeAtiva = cat.id === categoriaAtiva ? 'ativa' : '';
                html += `<button onclick="mudarCategoria('${cat.id}')" class="btn-aba ${classeAtiva}">${cat.nome}</button>`;
            }
            container.innerHTML = html;
        }

        function mudarCategoria(idCategoria) {
            categoriaAtiva = idCategoria;
            renderizarAbas();
            renderizarProdutos();
        }

        function renderizarProdutos() {
            const grid = document.getElementById('gridProdutos');
            const tituloSeacao = document.getElementById('tituloCategoria');
            const contador = document.getElementById('contadorProdutos');
            
            if(!grid || !tituloSeacao || !contador) return;

            const catAtual = categorias.find(c => c.id === categoriaAtiva);
            tituloSeacao.textContent = catAtual ? catAtual.nome : "";

            const filtrados = [];
            for (let i = 0; i < produtos.length; i++) {
                if (produtos[i].categoria === categoriaAtiva) {
                    filtrados.push(produtos[i]);
                }
            }

            contador.textContent = filtrados.length + " encontrados";

            if (filtrados.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #6b7280; padding: 40px 0;">Nenhum item nesta categoria.</div>`;
                return;
            }

            let htmlProdutos = "";
            for (let i = 0; i < filtrados.length; i++) {
                const p = filtrados[i];
                htmlProdutos += `
                    <div class="card-produto">
                        <div class="img-container">
                            <img src="${p.imagem}" alt="${p.titulo}">
                            <span class="tag-desconto">${p.desconto}</span>
                        </div>
                        <h3 class="card-titulo">${p.titulo}</h3>
                        <span class="preco-antigo">R$ ${p.precoOriginal.toFixed(2).replace('.', ',')}</span>
                        <span class="preco-atual">R$ ${p.precoOferta.toFixed(2).replace('.', ',')}</span>
                        <a href="${p.linkAfiliado}" target="_blank" class="btn-comprar">Ver Desconto</a>
                    </div>
                `;
            }
            grid.innerHTML = htmlProdutos;
        }

        // Execução direta e segura
        renderizarAbas();
        renderizarProdutos();
    </script>
</body>
</html>
