        /* Cabeçalho */
        header { background-color: #0a1128; border-b: 1px solid #1f2937; padding: 15px; text-align: center; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 15px; }

        /* Barra de Pesquisa com Filtro */
        .pesquisa-box { position: relative; width: 100%; max-width: 380px; }
        .pesquisa-box input { width: 100%; background-color: #1a1a1a; color: #e5e7eb; font-size: 14px; padding: 10px 40px 10px 20px; border-radius: 50px; border: 1px solid #374151; outline: none; transition: border-color 0.2s; }
        .pesquisa-box input:focus { border-color: #3b82f6; }
        .pesquisa-box i { position: absolute; right: 15px; top: 12px; color: #6b7280; }

        nav { background-color: #1a1a1a; padding: 12px; overflow-x: auto; display: flex; gap: 8px; justify-content: flex-start; border-b: 1px solid #2d3748; }
        @media (min-width: 1024px) { nav { justify-content: center; } }
        nav::-webkit-scrollbar { display: none; }
        nav { -ms-overflow-style: none; scrollbar-width: none; }
        
        .btn-aba { white-space: nowrap; background-color: #2d3748; border: 1px solid #4a5568; color: #a0aec0; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
        .btn-aba.ativa { background-color: #2563eb; border-color: #3b82f6; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* Vitrine de Grid */
        main { flex-grow: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; }
        .vitrine-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-b: 1px solid #2d3748; padding-bottom: 10px; }
        .vitrine-topo h2 { font-size: 18px; font-weight: 700; }
        .contador { font-size: 12px; color: #9ca3af; background-color: #1a1a1a; padding: 4px 12px; border-radius: 20px; border: 1px solid #2d3748; }
        
        .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card-produto { background-color: #161616; border: 1px solid #2d3748; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
        .card-produto:hover { transform: translateY(-4px); border-color: #2563eb; }
        
        .img-container { width: 100%; height: 160px; background-color: #222; border-radius: 6px; overflow: hidden; margin-bottom: 10px; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .tag-desconto { position: absolute; top: 5px; right: 5px; background-color: #dc2626; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 4px; }
        
        .card-titulo { font-size: 14px; color: #e5e7eb; margin-bottom: 8px; min-height: 38px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .precos { margin-bottom: 12px; }

        .preco-atual { font-size: 16px; font-weight: 700; color: #60a5fa; display: block; }

        .btn-whatsapp:hover { transform: scale(1.1); background-color: #20ba5a; }

        footer { background-color: #0a1128; padding: 20px; text-align: center; font-size: 12px; color: #9ca3af; margin-top: auto; border-top: 1px solid #1f2937; }

        // === MOTOR JAVASCRIPT: LÓGICA E RENDERIZAÇÃO INSTANTÂNEA COORDENADA ===
        function renderizarAbas() {
            const container = document.getElementById('containerAbas');
            if(!container) return;
            container.innerHTML = categorias.map(cat => {
                const ativa = cat.id === categoriaAtiva;
                return `<button onclick="mudarCategoria('${cat.id}')" class="btn-aba ${ativa ? 'ativa' : ''}">${cat.nome}</button>`;
            }).join('');
        }

        function mudarCategoria(idCategoria) {
            categoriaAtiva = idCategoria;
            document.getElementById('inputPesquisa').value = '';
            renderizarAbas();
            renderizarProdutos();
        }

        function renderizarProdutos(filtroTexto = '') {
            const grid = document.getElementById('gridProdutos');
            const tituloSeacao = document.getElementById('tituloCategoria');
            const contador = document.getElementById('contadorProdutos');
            
            if(!grid || !tituloSeacao || !contador) return;

            const catAtual = categorias.find(c => c.id === categoriaAtiva);
            tituloSeacao.textContent = catAtual ? catAtual.nome : "";

            const filtrados = produtos.filter(p => 
                p.categoria === categoriaAtiva && 
                p.titulo.toLowerCase().includes(filtroTexto.toLowerCase())
            );

            contador.textContent = `${filtrados.length} encontrados`;

            if (filtrados.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#6b7280; padding:40px 0; font-size: 14px;">Nenhum produto encontrado nesta seção.</div>`;
