<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAUS | E-commerce & Dropshipping</title>
    
    <!-- ⚠️ CORREÇÃO AQUI: Novo link oficial e estável do Tailwind CSS -->
    <link href="https://unpkg.com@^2/dist/tailwind.min.css" rel="stylesheet">
    
    <!-- FontAwesome para os ícones das abas -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* CSS Personalizado para complementar o Tailwind */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Garantindo o fundo escuro caso o CSS demore a carregar */
        body { background-color: #121212; color: #ffffff; }
        
        .card-produto {
            background-color: #1a1a1a;
            border: 1px border #2d3748;
            transition: all 0.3s ease;
        }
        .card-produto:hover {
            border-color: #3182ce;
            transform: translateY(-4px);
        }
    </style>
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen flex flex-col">

    <!-- 1. CABEÇALHO (HEADER) -->
    <header class="bg-[#0a1128] px-4 py-3 shadow-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-left w-full md:w-auto">
                <h1 class="text-2xl font-black tracking-wider text-blue-400">LAUS</h1>
                <p class="text-xs text-gray-400 tracking-widest font-semibold uppercase">E-commerce & Dropshipping</p>
            </div>
            <div class="relative w-full md:w-96">
                <input type="text" id="inputPesquisa" placeholder="Buscar produtos..." class="w-full bg-[#1a1a1a] text-sm text-gray-200 pl-4 pr-10 py-2 rounded-full border border-gray-700 focus:outline-none focus:border-blue-500">
            </div>
            <div class="text-gray-300 text-sm font-medium flex items-center gap-2 hover:text-white cursor-pointer w-full md:w-auto justify-end">
                <i class="fa-solid fa-heart text-red-500"></i>
                <span>Favoritos (0)</span>
            </div>
        </div>
    </header>

    <!-- 2. MENU DE CATEGORIAS (10 ABAS) -->
    <nav class="bg-[#1a1a1a] border-b border-gray-800 px-4 py-2 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="containerAbas">
            <!-- Gerado via JS -->
        </div>
    </nav>

    <!-- 3. VITRINE PRINCIPAL -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-3">
            <h2 id="tituloCategoria" class="text-xl font-bold tracking-wide text-gray-100 flex items-center gap-2"></h2>
            <span id="contadorProdutos" class="text-xs text-gray-500 font-semibold bg-[#1a1a1a] px-3 py-1 rounded-full border border-gray-800">0 itens encontrados</span>
        </div>

        <div id="gridProdutos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Cards via JS -->
        </div>
    </main>

    <!-- 4. RODAPÉ (FOOTER) -->
    <footer class="bg-[#0a1128] border-t border-gray-800 px-4 py-6 text-center text-sm text-gray-400 mt-12">
        <p class="max-w-2xl mx-auto text-xs text-gray-500 mb-4">
            Este site funciona como um catálogo vitrine. Ao clicar em "Ver Desconto", você será redirecionado para a plataforma oficial do parceiro.
        </p>
        <p>&copy; 2026 LAUS. Todos os direitos reservados.</p>
    </footer>

    <!-- 5. SISTEMA E CADASTRO DE PRODUTOS -->
    <script>
        const categorias = [
            { id: "mais_vendidos", nome: "Mais Vendidos", icone: "fa-fire text-orange-500" },
            { id: "eletronicos", nome: "Eletrônicos", icone: "fa-mobile-screen-button text-blue-400" },
            { id: "casa_cozinha", nome: "Casa e Cozinha", icone: "fa-house text-amber-500" },
            { id: "moda_beleza", nome: "Moda e Beleza", icone: "fa-wand-magic-sparkles text-pink-400" },
            { id: "pet_shop", nome: "Pet Shop", icone: "fa-dog text-teal-400" },
            { id: "saude_fitness", nome: "Saúde e Fitness", icone: "fa-bullseye text-red-500" },
            { id: "cursos", nome: "Cursos Digitais", icone: "fa-graduation-cap text-indigo-400" },
            { id: "ebooks", nome: "E-books", icone: "fa-book-open text-emerald-400" },
            { id: "ferramentas", nome: "Ferramentas", icone: "fa-screwdriver-wrench text-slate-400" },
            { id: "brinquedos", nome: "Brinquedos", icone: "fa-puzzle-piece text-purple-400" }
        ];

        let categoriaAtiva = "eletronicos";

        // Lista de Produtos Cadastrados
        const produtos = [
            {
                id: 1,
                titulo: "Fone de Ouvido Bluetooth Sem Fio TWS - Antirruído Pro",
                precoOriginal: 199.90,
                precoOferta: 99.90,
                desconto: "-50%",
                imagem: "https://unsplash.com",
                categoria: "eletronicos",
                linkAfiliado: "#"
            },
            {
                id: 2,
                titulo: "Relógio Smartwatch Digital Esportivo Inteligente Bluetooth",
                precoOriginal: 249.90,
                precoOferta: 129.90,
                desconto: "-48%",
                imagem: "https://unsplash.com",
                categoria: "eletronicos",
                linkAfiliado: "#"
            }
        ];

        function inicializarSite() {
            renderizarAbas();
            renderizarProdutos();
            
            document.getElementById('inputPesquisa').addEventListener('input', (e) => {
                renderizarProdutos(e.target.value);
            });
        }

        function renderizarAbas() {
            const container = document.getElementById('containerAbas');
            container.innerHTML = categorias.map(cat => {
                const ativa = cat.id === categoriaAtiva;
                return `
                    <button onclick="mudarCategoria('${cat.id}')" class="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold border transition-all duration-200 ${ativa ? 'bg-blue-600 border-blue-500 text-white' : 'bg-gray-800 border-gray-700 text-gray-400 hover:text-white'}">
                        <i class="fa-solid ${cat.icone}"></i>
                        <span>${cat.nome}</span>
                    </button>
                `;
            }).join('');
        }

        function mudarCategoria(idCategoria) {
            categoriaAtiva = idCategoria;
            document.getElementById('inputPesquisa').value = ''; 
            renderizarAbas();
            renderizarProdutos();
        }

        function renderizarProdutos(termoPesquisa = '') {
            const grid = document.getElementById('gridProdutos');
            const tituloSeacao = document.getElementById('tituloCategoria');
            const contador = document.getElementById('contadorProdutos');
            
            const catAtual = categorias.find(c => c.id === categoriaAtiva);
            tituloSeacao.innerHTML = `<i class="fa-solid ${catAtual.icone}"></i> ${catAtual.nome}`;

            const produtosFiltrados = produtos.filter(p => {
                const matchesCategoria = p.categoria === categoriaAtiva;
                const matchesPesquisa = p.titulo.toLowerCase().includes(termoPesquisa.toLowerCase());
                return matchesCategoria && matchesPesquisa;
            });

            contador.textContent = `${produtosFiltrados.length} encontrados`;

            if (produtosFiltrados.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <p class="text-sm">Nenhum produto cadastrado nesta seção ainda.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = produtosFiltrados.map(p => `
                <div class="card-produto rounded-xl overflow-hidden shadow-lg flex flex-col p-4">
                    <div class="relative w-full h-48 bg-[#222] rounded-lg overflow-hidden mb-4">
                        <img src="${p.imagem}" alt="${p.titulo}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded">${p.desconto}</span>
                    </div>
                    <h3 class="text-sm font-medium text-gray-200 h-10 overflow-hidden mb-2">${p.titulo}</h3>
                    <div class="mb-4">
                        <span class="text-xs text-gray-500 line-through block">R$ ${p.precoOriginal.toFixed(2).replace('.', ',')}</span>
                        <span class="text-lg font-bold text-blue-400">R$ ${p.precoOferta.toFixed(2).replace('.', ',')}</span>
                    </div>
                    <a href="${p.linkAfiliado}" target="_blank" class="w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 rounded-lg block uppercase tracking-wider">
                        Ver Desconto
                    </a>
                </div>
            `).join('');
        }

        window.onload = inicializarSite;
    </script>
</body>
</html>
