<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAUS | E-commerce & Dropshipping</title>
    <!-- Tailwind CSS para o design moderno e escuro -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome para os ícones das abas -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Personalização da barra de rolagem das abas no celular */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#121212] text-white font-sans min-h-screen flex flex-col">

    <!-- 1. CABEÇALHO (HEADER) -->
    <header class="bg-[#0a1128] border-b border-gray-800 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Logo LAUS -->
            <div class="text-left w-full md:w-auto">
                <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-400">LAUS</h1>
                <p class="text-[10px] text-gray-400 tracking-widest font-semibold uppercase">E-commerce & Dropshipping</p>
            </div>
            <!-- Barra de Pesquisa -->
            <div class="relative w-full md:w-96">
                <input type="text" id="inputPesquisa" placeholder="Buscar produtos..." class="w-full bg-[#1a1a1a] text-sm text-gray-200 pl-4 pr-10 py-2 rounded-full border border-gray-700 focus:outline-none focus:border-blue-500 transition-colors">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-3 text-gray-500"></i>
            </div>
            <!-- Favoritos -->
            <div class="text-gray-300 text-sm font-medium flex items-center gap-2 hover:text-white cursor-pointer w-full md:w-auto justify-end">
                <i class="fa-solid fa-heart text-red-500"></i>
                <span>Favoritos (0)</span>
            </div>
        </div>
    </header>

    <!-- 2. MENU DE CATEGORIAS (10 ABAS) -->
    <nav class="bg-[#1a1a1a] border-b border-gray-800 px-4 py-2 sticky top-[69px] z-40 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="containerAbas">
            <!-- As abas serão geradas automaticamente pelo JavaScript -->
        </div>
    </nav>

    <!-- 3. VITRINE PRINCIPAL -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-3">
            <h2 id="tituloCategoria" class="text-xl font-bold tracking-wide text-gray-100 flex items-center gap-2">
                <!-- Título injetado via JS -->
            </h2>
            <span id="contadorProdutos" class="text-xs text-gray-500 font-semibold bg-[#1a1a1a] px-3 py-1 rounded-full border border-gray-800">0 itens encontrados</span>
        </div>

        <!-- Grade de Produtos -->
        <div id="gridProdutos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os cards dos produtos aparecerão aqui via JavaScript -->
        </div>
    </main>

    <!-- 4. RODAPÉ (FOOTER) -->
    <footer class="bg-[#0a1128] border-t border-gray-800 px-4 py-6 text-center text-sm text-gray-400 mt-12">
        <p class="max-w-2xl mx-auto text-xs text-gray-500 mb-4">
            Este site funciona como um catálogo vitrine. Ao clicar em "Ver Desconto", você será redirecionado para a plataforma oficial do parceiro para concluir a compra com total segurança.
        </p>
        <p>&copy; 2026 LAUS. Todos os direitos reservados.</p>
    </footer>

    <!-- 5. SISTEMA E CADASTRO DE PRODUTOS -->
    <script>
        // Mapeamento das 10 abas com seus ícones correspondentes
        const categorias = [
            { id: "mais_vendidos", nome: "Mais Vendidos", icone: "fa-fire text-orange-500" },
            { id: "eletronicos", nome: "Eletrônicos", icone: "fa-mobile-screen-button text-blue-400" },
            { id: "casa_cozinha", nome: "Casa e Cozinha", icone: "fa-house text-amber-500" },
            { id: "moda_beleza", nome: "Moda e Beleza", icone: "fa-wand-magic-sparkles text-pink-400" },
            { id: "pet_shop", nome: "Pet Shop", icone: "fa-dog text-teal-400" },
            { id: "saude_fitness", nome: "Saúde e Fitness", icone: "fa-bullseye text-red-500" },
            { id: "cursos", nome: "Cursos Digitais", icone: "fa-graduation-cap text-indigo-400" },
            { id: "ebooks", nome: "E-books", icone: "fa-book-open text-emerald-400" },
            { id: "ferramentas", nome: "Ferramentas", icone: "fa-screwdriver-wrench text-slate-400" },
            { id: "brinquedos", nome: "Brinquedos", icone: "fa-puzzle-piece text-purple-400" }
        ];

        // Categoria que inicia aberta ao carregar o site
        let categoriaAtiva = "eletronicos";

        // =========================================================================
        // 📦 ABAIXO FICA SUA LISTA DE PRODUTOS. PREENCHA AQUI MANUALMENTE!
        // =========================================================================
        const produtos = [
            // EXEMPLO PRONTO DE PRODUTO FISÍCO (Para você ver como fica)
            {
                id: 1,
                titulo: "fone de ouvido, fone sem fio, fone Bluetooth, fone TWS, fone Kaidi, Kaidi KD-771, fone Bluetooth Kaidi, fone de ouvido",
                precoOriginal: 98.89,
                precoOferta: 79.12,
                desconto: "-20%",
                imagem: "https://down-br.img.susercontent.com/file/br-11134207-820m1-mslvfs4gw5jbb8.webp",
                categoria: "eletronicos", // Deve ser exatamente igual ao 'id' da categoria acima
                linkAfiliado: "https://s.shopee.com.br/3g3ofIXgYo"
            },
            
            // EXEMPLO PRONTO DE PRODUTO DIGITAL (Para você ver como fica)
            {
                id: 2,
                titulo: "E-book: Receitas Práticas e Saudáveis para AirFryer",
                precoOriginal: 49.90,
                precoOferta: 24.90,
                desconto: "-50%",
                imagem: "https://unsplash.com",
                categoria: "ebooks",
                linkAfiliado: "https://kiwify.com.br"
            },

            // 🌟 ESTRUTURA VAZIA: COPIE DA LINHA ABAIXO ATÉ A VÍRGULA FINAL PARA ADICIONAR MAIS PRODUTOS:
            {
                id: 3,
                titulo: "COLE O NOME DO PRODUTO AQUI",
                precoOriginal: 150.00,
                precoOferta: 75.00,
                desconto: "-50%",
                imagem: "COLE_LINK_DA_IMAGEM_AQUI",
                categoria: "ESCREVA_A_CATEGORIA_AQUI", 
                linkAfiliado: "COLE_SEU_LINK_DE_AFILIADO_AQUI"
            }, // <-- Lembre-se de sempre manter essa vírgula se for colocar outro produto abaixo!

        ];
        // =========================================================================
        // ⚙️ MOTOR DO SITE (Não altere nada abaixo a menos que saiba JavaScript)
        // =========================================================================

        function inicializarSite() {
            renderizarAbas();
            renderizarProdutos();
            
            document.getElementById('inputPesquisa').addEventListener('input', (e) => {
                renderizarProdutos(e.target.value);
            });
        }

        function renderizarAbas() {
            const container = document.getElementById('containerAbas');
            container.innerHTML = categorias.map(cat => {
                const ativa = cat.id === categoriaAtiva;
                return `
                    <button onclick="mudarCategoria('${cat.id}')" class="whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold tracking-wide border transition-all duration-200 ${ativa ? 'bg-[#0052cc] border-blue-500 text-white shadow-md' : 'bg-[#222] border-gray-800 text-gray-400 hover:bg-[#2a2a2a] hover:text-gray-200'}">
                        <i class="fa-solid ${cat.icone}"></i>
                        <span>${cat.nome}</span>
                    </button>
                `;
            }).join('');
        }

        function mudarCategoria(idCategoria) {
            categoriaAtiva = idCategoria;
            document.getElementById('inputPesquisa').value = ''; 
            renderizarAbas();
            renderizarProdutos();
        }

        function renderizarProdutos(termoPesquisa = '') {
            const grid = document.getElementById('gridProdutos');
            const tituloSeacao = document.getElementById('tituloCategoria');
            const contador = document.getElementById('contadorProdutos');
            
            const catAtual = categorias.find(c => c.id === categoriaAtiva);
            tituloSeacao.innerHTML = `<i class="fa-solid ${catAtual.icone}"></i> ${catAtual.nome}`;

            const produtosFiltrados = produtos.filter(p => {
                const matchesCategoria = p.categoria === categoriaAtiva;
                const matchesPesquisa = p.titulo.toLowerCase().includes(termoPesquisa.toLowerCase());
                return matchesCategoria && matchesPesquisa;
            });

            contador.textContent = `${produtosFiltrados.length} ${produtosFiltrados.length === 1 ? 'item encontrado' : 'itens encontrados'}`;

            if (produtosFiltrados.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <i class="fa-solid fa-box-open text-4xl mb-3 block"></i>
                        <p class="text-sm">Nenhum produto cadastrado ou encontrado nesta seção ainda.</p>
                    </div>
